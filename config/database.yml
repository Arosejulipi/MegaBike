default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  adapter: sqlite3
  <<: *default
  database: db/development.sqlite3

test:
  adapter: sqlite3
  <<: *default
  database: db/test.sqlite3

production:
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  # Fail fast instead of hanging on unreachable DB (helps avoid Render build timeouts).
  connect_timeout: <%= ENV.fetch("DB_CONNECT_TIMEOUT", 5) %>
